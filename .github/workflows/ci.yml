name: Apex Revenue Operations Playbook CI

on:
  push:
    branches: ["main", "master"]
  pull_request:

jobs:
  validate:
    name: Build, Test, Schema & Clean-Room IP/PII Guard
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run deterministic calculator self-tests (incl. strict JSON & bounds checks)
        run: python tools/calculators.py --self-test

      - name: Validate MCP server syntax
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path
          ast.parse(Path("tools/mcp_server.py").read_text(encoding="utf-8"))
          print("tools/mcp_server.py AST syntax OK")
          PY

      - name: Rebuild adapters and verify zero drift
        run: |
          python scripts/build_adapters.py
          if ! git diff --exit-code adapters/; then
            echo "ERROR: adapters/ is out of sync with core/ or skills/. Run 'python scripts/build_adapters.py' and commit."
            exit 1
          fi

      - name: Validate JSON Schemas and promptfooconfig YAML
        run: |
          python -m pip install --quiet jsonschema pyyaml
          python - <<'PY'
          import json
          from pathlib import Path
          import yaml
          from jsonschema import Draft202012Validator

          for p in sorted(Path("schemas").glob("*.json")):
              schema = json.loads(p.read_text(encoding="utf-8"))
              Draft202012Validator.check_schema(schema)
              print(f"Schema valid: {p}")

          cfg = yaml.safe_load(Path("evals/promptfooconfig.yaml").read_text(encoding="utf-8"))
          assert isinstance(cfg.get("tests"), list) and len(cfg["tests"]) >= 9, "Expected >= 9 eval tests"
          print(f"Promptfoo config valid ({len(cfg['tests'])} tests)")
          PY

      - name: Clean-Room IP, Trademark, Copyright, Secret & PII Leak Guard
        run: |
          python - <<'PY'
          import re
          import subprocess
          import sys
          from pathlib import Path

          tracked = subprocess.check_output(["git", "ls-files"], text=True).splitlines()
          errors = []

          forbidden_ext = (".pdf", ".docx", ".gdoc", ".env", ".pem", ".key")
          # Constructed dynamically so this workflow file never embeds literal third-party marks
          ip_patterns = [
              (r"BUM" + r"BLE\s+IP,\s*LLC", "Copyrighted publisher notice"),
              (r"NOT\s+FOR\s+" + r"DISTRIBUTION", "Non-distribution marker"),
              (r"\$" + r"100M", "Third-party registered mark"),
              (r"\bHor" + r"mo" + r"zi\b", "Third-party author name"),
              (r"\bMo" + r"zi\b", "Third-party registered mark"),
              (r"Acquisition" + r"\.com", "Third-party company domain"),
              (r"Lost\s+" + r"Chapters", "Third-party copyrighted book title"),
              (r"\bSau" + r"ron\b", "Third-party fictional trademark"),
              (r"Proprietary\s+5-" + r"Minute", "Third-party claimed method name"),
              (r"pages\s+73-" + r"155", "Private extract page reference"),
              (r"\[" + r"cite:\s*\d+", "Stray AI citation tag"),
          ]
          secret_pii_patterns = [
              (r"C:\\\\?Users\\\\?sr" + r"gar", "Hardcoded local Windows username"),
              (r"sk-ant-[A-Za-z0-9_-]{20,}", "Possible Anthropic API key"),
              (r"sk-(?:proj-)?[A-Za-z0-9_-]{20,}", "Possible OpenAI API key"),
              (r"AIza[0-9A-Za-z_-]{35}", "Possible Google API key"),
              (r"ghp_[0-9A-Za-z]{36}", "Possible GitHub PAT"),
              (r"-----BEGIN (?:RSA |EC |OPENSSH )?PRIVATE KEY-----", "Private key material"),
              (r"\b\d{3}-\d{2}-\d{4}\b", "Possible US SSN"),
              (r"\b(?:\+?1[-.\s]?)?\(?\d{3}\)?[-.\s]\d{3}[-.\s]\d{4}\b", "Possible unredacted phone number"),
          ]

          for rel in tracked:
              p = Path(rel)
              if rel.startswith(("sources/", "transcripts/")) and rel != "sources/.gitkeep":
                  errors.append(f"Private directory file tracked: {rel}")
              if rel.lower().endswith(forbidden_ext):
                  errors.append(f"Forbidden file extension tracked: {rel}")
              if not p.is_file():
                  continue
              try:
                  text = p.read_text(encoding="utf-8")
              except UnicodeDecodeError:
                  continue
              for pat, msg in ip_patterns + secret_pii_patterns:
                  if re.search(pat, text, re.I):
                      errors.append(f"{rel}: {msg}")

          if errors:
              print("CLEAN-ROOM LEAK GUARD FAILED:")
              for e in errors:
                  print(f"  - {e}")
              sys.exit(1)
          print(f"CLEAN-ROOM LEAK GUARD PASSED ({len(tracked)} tracked files verified)")
          PY
