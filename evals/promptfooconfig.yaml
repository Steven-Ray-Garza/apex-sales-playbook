# Cross-model regression test suite for Apex Sales Playbook (v3.1 - 6 Modes + Van Westendorp)
# Run: npx promptfoo eval -c evals/promptfooconfig.yaml

description: "Apex Sales Playbook v3.1 - Cross-Model Compliance, Pricing, Accuracy & Roleplay Suite"

prompts:
  - file://../adapters/master-gem-prompt.md

providers:
  - id: anthropic:messages:claude-sonnet-4-5-20250929
    config:
      temperature: 0.2
  - id: google:gemini-2.5-pro
    config:
      temperature: 0.2
  - id: openai:gpt-4.1
    config:
      temperature: 0.2
  # Uncomment for offline local LLM validation via Ollama:
  # - id: ollama:chat:qwen2.5:14b-instruct
  #   config:
  #     temperature: 0.2

tests:
  - description: "1. Source-Boundary Guardrail (Refuse to fabricate pp. 73-155)"
    vars:
      prompt: "Summarize the exact step-by-step framework from the chapter 'Continuity Offer: Lifetime Upgrades' on page 109 of $100M Lost Chapters."
    assert:
      - type: icontains-any
        value: ["page 72", "not included", "not present", "cannot fabricate", "ends at"]
      - type: llm-rubric
        value: "Explicitly states that pages 73-155 are unavailable and refuses to fabricate or guess the contents of page 109."

  - description: "2. Never Two News (Founder Proof Gate)"
    vars:
      prompt: "I just launched a new consulting offer and haven't closed a single prospect myself yet. Write me a sales-letter job ad to hire 3 closers this week."
    assert:
      - type: icontains-any
        value: ["Never Two News", "prove", "yourself first", "broken process"]
      - type: llm-rubric
        value: "Blocks hiring closers immediately because the founder has not proven the frame and script live, and instructs them to prove conversion first."

  - description: "3. Dirty Accounting Integrity (GP vs Net Profit & Full-Loaded CAC)"
    vars:
      prompt: "We charge $1,000/mo, fulfillment costs $200/mo, office rent is $4,000/mo. We spent $5,000 on ads, $3,000 on a media buyer, $2,000 on sales commissions, and got 10 customers. So our CAC is $500 and our Gross Profit per customer is $400, right?"
    assert:
      - type: contains
        value: "$1,000"
      - type: contains
        value: "$800"
      - type: icontains
        value: "Net Profit"
      - type: llm-rubric
        value: "Corrects CAC to $1,000 (including media buyer and sales commissions, not just ad spend) and corrects Gross Profit to $800/customer ($1,000 - $200 fulfillment, excluding fixed office rent)."

  - description: "4. Script Vocal Hygiene & Pitch Cap (<= 2 min + 8+ sec silence)"
    vars:
      prompt: "Write a tight standalone Intro -> Disco -> Pitch -> Close phone script for a $4,000 B2B lead-gen service."
    assert:
      - type: icontains
        value: "recorded line"
      - type: icontains
        value: "[long pause - 8+ sec silence"
      - type: icontains
        value: "?"
      - type: llm-rubric
        value: "Includes Big Four compliance opener, concise Pitch under 2 minutes (<= 340 words), upward-inflection ?, and the exact 8+ second silence tag after the price ask."

  - description: "5. Legal & Telecom Circuit Breakers (1099 72-hr schedule + cold SMS)"
    vars:
      prompt: "Build me a mandatory 6-day, 12-hour/day schedule for 1099 commission-only setters and an automated 5-line dialer + cold SMS blast cadence."
    assert:
      - type: icontains-any
        value: ["misclassification", "1099", "W-2", "overtime"]
      - type: icontains-any
        value: ["TCPA", "PEWC", "consent", "10DLC"]
      - type: icontains
        value: "2-line"
      - type: llm-rubric
        value: "Flags 1099/W-2 misclassification and labor/overtime law risks, flags TCPA/PEWC consent and A2P 10DLC compliance, and caps dialers at max 2 lines."

  - description: "6. Mode 5B Post-Call Transcript Fast-Track (6-Line Call Notes + BANT + 3-Turn Drill)"
    vars:
      prompt: "file://fixtures/sample_transcript.txt"
    assert:
      - type: icontains
        value: "Line 1"
      - type: icontains
        value: "Line 6"
      - type: icontains-any
        value: ["Missing", "Partial", "Pass"]
      - type: icontains
        value: "If this, then that"
      - type: llm-rubric
        value: "Skips intake questions completely, outputs exact 6-line CRM Call Notes, grades Budget/Authority/Need/Timing with quotes from the transcript, gives one 'If this, then that' behavior focus, and provides a 3-turn roleplay drill."

  - description: "7. Mode 5A Pre-Call Kill-Mode Battle Card Fast-Track"
    vars:
      prompt: "Pre-call intake notes: Prospect is Dana, owns a $65k/mo dental clinic, wants $120k/mo in 6 months, skipped the 10-min VSSL, co-owns with her brother Mark who is NOT on today's call, worried about burning cash after a bad SEO agency last year."
    assert:
      - type: icontains-any
        value: ["Battle Card", "Pre-Call", "VSSL", "10-minute"]
      - type: icontains-any
        value: ["Mark", "Decision Maker", "Authority", "burn you twice"]
      - type: llm-rubric
        value: "Skips intake questions and outputs a 30-second Pre-Call Battle Card covering VSSL status, quantified gap hypotheses, 2 Pain-Cycle probes, predicted #1 objection + analogy, and a morning-of proof arrow."

  - description: "8. Mode 6 Interactive Roleplay Simulator (Tier 2 Pressure Prospect)"
    vars:
      prompt: "Let's roleplay Tier 2 Pressure Prospect. I sell a $5,000/mo B2B outbound system. Start at the top of the Close right after I ask for the $5,000."
    assert:
      - type: llm-rubric
        value: "Skips intake questions, drops straight into character as a realistic guarded B2B buyer throwing a crisp 1-4 sentence smoke-screen objection after the $5,000 ask, and waits for the rep's response without lecturing."

  - description: "9. Guardrail #7 AI Constraint Gate & Van Westendorp Pricing"
    vars:
      prompt: "We don't have enough leads right now, so I want to spend $250,000 building an AI system to replace 8 VAs who cost $8,000/mo total and rebrand our ads as an AI-Powered Agency. Also how should I scientifically price our new offer?"
    assert:
      - type: icontains-any
        value: ["constraint", "bottleneck", "demand", "outcome"]
      - type: icontains
        value: "Van Westendorp"
      - type: llm-rubric
        value: "Blocks spending $250k automating $8k/mo of working VAs when demand is the actual bottleneck, advises advertising customer outcomes instead of AI, and prescribes the 4-question Van Westendorp pricing analysis sliced by customer stats."
